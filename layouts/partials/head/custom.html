<script>
    window.dvlTrack = function (eventName, params) {
        const consent = window.dvlAnalyticsConsent;
        if (typeof window.gtag !== 'function' || (consent && consent.getChoice() !== 'granted')) {
            return false;
        }
        window.gtag('event', eventName, params || {});
        return true;
    };

    window.dvlGetGaIdentity = async function () {
        const analytics = window.dvlAnalytics;
        if (!analytics) {
            return { client_id: '', session_id: '' };
        }

        const [clientId, sessionId] = await Promise.all([
            analytics.getClientId(),
            analytics.getSessionId()
        ]);

        return {
            client_id: clientId || '',
            session_id: sessionId || ''
        };
    };

    (() => {
        const salesHosts = new Set([
            'personal.data-viz-lectures.com',
            'www.udemy.com',
            'udemy.com'
        ]);

        const trackSelectContent = (params) => {
            if (typeof window.dvlTrack !== 'function') {
                return;
            }

            window.dvlTrack('select_content', params);
        };

        document.addEventListener('click', (event) => {
            const link = event.target.closest('a[href]');
            if (!link) {
                return;
            }

            const href = link.getAttribute('href') || '';
            let url;

            try {
                url = new URL(href, window.location.origin);
            } catch (error) {
                return;
            }

            const card = link.closest('.external-link-card');
            if (card) {
                trackSelectContent({
                    content_type: 'external_link_card',
                    item_id: url.href,
                    item_name: (link.querySelector('.external-link-card__title')?.textContent || link.textContent || '').trim().slice(0, 100),
                    link_url: url.href,
                    link_domain: url.hostname,
                    outbound: url.origin !== window.location.origin
                });
                return;
            }

            if (link.classList.contains('home-feature-card')) {
                trackSelectContent({
                    content_type: 'home_feature_card',
                    item_id: url.pathname === '/' ? url.href : (url.pathname || url.href),
                    item_name: (link.querySelector('.home-feature-card__title')?.textContent || link.textContent || '').trim().slice(0, 100),
                    link_url: url.href,
                    link_domain: url.hostname,
                    outbound: url.origin !== window.location.origin
                });
                return;
            }

            if (salesHosts.has(url.hostname)) {
                trackSelectContent({
                    content_type: 'outbound_sales_link',
                    item_id: url.href,
                    item_name: (link.textContent || url.hostname).trim().slice(0, 100),
                    link_url: url.href,
                    link_domain: url.hostname,
                    outbound: true
                });
            }
        });
    })();
</script>

<script>
    try {
        if (window.sessionStorage && sessionStorage.getItem('dvl_pending_contact_lead') === '1') {
            const tracked = window.dvlTrack('generate_lead', {
                form_name: 'contact',
                content_category: 'contact'
            });
            if (tracked) {
                sessionStorage.removeItem('dvl_pending_contact_lead');
            }
        }
    } catch (error) {
        console.warn('Failed to track contact lead completion.', error);
    }
</script>

{{ if eq .RelPermalink "/pages/checkout-complete/" }}
<script>
    (() => {
        const query = new URLSearchParams(window.location.search);
        const sessionId = query.get('session_id');

        if (!sessionId || !sessionId.startsWith('cs_')) {
            return;
        }

        const trackedKey = `dvl_purchase_tracked_${sessionId}`;

        try {
            if (window.localStorage && localStorage.getItem(trackedKey) === '1') {
                return;
            }
        } catch (error) {
            console.warn('Failed to read purchase tracking state.', error);
        }

        fetch(`/.netlify/functions/stripe-checkout?session_id=${encodeURIComponent(sessionId)}`)
            .then((response) => {
                if (!response.ok) {
                    throw new Error('Checkout Session retrieval failed.');
                }

                return response.json();
            })
            .then((session) => {
                if (!session || session.payment_status !== 'paid') {
                    return;
                }

                const metadata = session.metadata || {};
                const value = typeof session.amount_total === 'number' ? session.amount_total : undefined;
                const currency = (session.currency || 'jpy').toUpperCase();
                const courseKey = metadata.course_key || query.get('course_key') || '';
                const courseName = metadata.course_name || courseKey || 'データ可視化講習';
                const contentCategory = metadata.content_category || '';
                const schedule = metadata.schedule || query.get('schedule') || '';

                let tracked = false;
                if (typeof window.dvlTrack === 'function') {
                    tracked = window.dvlTrack('purchase', {
                        transaction_id: session.id,
                        affiliation: 'Stripe Checkout',
                        value,
                        currency,
                        course_key: courseKey,
                        course_name: courseName,
                        content_category: contentCategory,
                        schedule,
                        event_source: 'browser',
                        items: [
                            {
                                item_id: courseKey,
                                item_name: courseName,
                                item_category: contentCategory,
                                price: value,
                                quantity: 1
                            }
                        ]
                    });
                }

                try {
                    if (tracked && window.localStorage) {
                        localStorage.setItem(trackedKey, '1');
                    }
                } catch (error) {
                    console.warn('Failed to save purchase tracking state.', error);
                }
            })
            .catch((error) => {
                console.warn('Failed to track purchase completion.', error);
            });
    })();
</script>
